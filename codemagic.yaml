workflows:
  ios-dev-build:
    name: iOS Dev Build
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - xcodebuild -scheme IPAGURU-Package -configuration Release -destination 'generic/platform=iOS' -archivePath $CM_BUILD_DIR/build.xcarchive clean archive
    artifacts:
      - $CM_BUILD_DIR/*.ipa
