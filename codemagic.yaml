workflows:
  ios-workflow:
    name: iOS Dev Build
    max_build_duration: 120
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - xcodebuild -scheme IPAGURUApp -configuration Release -destination 'generic/platform=iOS' -archivePath $CM_BUILD_DIR/build.xcarchive clean archive
      - xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/build.xcarchive -exportPath $CM_BUILD_DIR/output -exportOptionsPlist ExportOptions.plist
    artifacts:
      - output/*.ipa
